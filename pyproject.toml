[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "typemaxx"
dynamic = ["version"]
description = "Typing and validation utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jaxtyping>=0.2.36",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "build>=1.2",
    "twine>=5.0",
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/typemaxx/_version.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape specs (e.g. Float[np.ndarray, "H W C"]) are not valid
# Python annotation syntax, which ruff otherwise flags as F722/F821.
"src/typemaxx/types.py" = ["F722", "F821"]

[tool.ruff.format]
docstring-code-format = true
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
typemaxx = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
